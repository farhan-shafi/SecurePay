# SecurePay local development stack.
#
# Bring everything up with:   docker compose up --build
# Stop and remove with:       docker compose down
# Wipe the database too with: docker compose down -v
#
# Service ports (host:container):
#   api-gateway          8000 -> 8000   (the only entrypoint you normally call)
#   user-service         8001 -> 8000
#   wallet-service       8002 -> 8000
#   transaction-service  8003 -> 8000
#   fraud-service        8004 -> 8000   (internal; called by transaction-service)
#   notification-service (no port; background worker, consumes from rabbitmq)
#   postgres             5432 -> 5432
#   redis                6379 -> 6379
#   rabbitmq             5672 -> 5672   (AMQP), 15672 -> 15672 (management UI)

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Services wait for this to pass before they start (see depends_on below).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Message broker. The transaction-service publishes "transfer completed"
  # events here; the notification-service consumes them. The default `guest`
  # user can only connect from localhost, so we set explicit credentials that
  # work across the Docker network.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP (the protocol the services speak)
      - "15672:15672"  # management UI — open http://localhost:15672 in a browser
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-securepay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-securepay_dev_password}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: applies database migrations (alembic upgrade head) then exits.
  # Every service that touches the database waits for this to finish first
  # (depends_on: condition: service_completed_successfully), so exactly one
  # process ever builds the schema — no more concurrent create_all() races.
  migrator:
    build:
      context: .
      dockerfile: services/migrator/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8000
      WALLET_SERVICE_URL: http://wallet-service:8000
      TRANSACTION_SERVICE_URL: http://transaction-service:8000
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
      transaction-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # Email (Resend preferred, Brevo fallback) — verification OTP. No key = log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-SecurePay}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FRAUD_SERVICE_URL: http://fraud-service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-securepay}:${RABBITMQ_PASSWORD:-securepay_dev_password}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      fraud-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-service/Dockerfile
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Background worker (no HTTP port). Consumes "transaction.completed" events
  # from rabbitmq and writes a notification row per party. It needs the database
  # (to read wallets/users and write notifications) and the broker (to consume).
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-securepay}:${RABBITMQ_PASSWORD:-securepay_dev_password}@rabbitmq:5672/
      # Email (Resend preferred, Brevo fallback) — transaction emails. No key = log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-SecurePay}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
