# Alembic configuration for SecurePay.
#
# The whole stack shares ONE Postgres database, so there is ONE migration
# history living here. A dedicated `migrator` container runs `alembic upgrade
# head` on startup; the application services wait for it to finish before they
# boot (see docker-compose.yml).
#
# The database URL is intentionally NOT set here. migrations/env.py reads it
# from the same DATABASE_URL environment variable the services use, so there is
# a single source of truth for the connection string.

[alembic]
script_location = migrations
prepend_sys_path = .
# Name new revision files like 0001_initial_schema.py for readable ordering.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
